name: tradingagents-web

services:
  web-api:
    build:
      context: .
      dockerfile: docker/web-api.Dockerfile
    image: tradingagents-web-api:local
    env_file:
      - .env
      - .env.web.local
    environment:
      TRADINGAGENTS_WEB_HOST: 0.0.0.0
      TRADINGAGENTS_WEB_PORT: 8000
      TRADINGAGENTS_WEB_DB: /data/web.sqlite3
      # Do not inherit host-local proxy settings from .env into containers.
      # A value like http://127.0.0.1:7890 points at the container itself and
      # breaks health checks plus outbound provider calls unless explicitly
      # configured for Docker networking.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,::1,web-api,web"
      no_proxy: "localhost,127.0.0.1,::1,web-api,web"
    volumes:
      - tradingagents_web_data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web-frontend.Dockerfile
      args:
        VITE_TRADINGAGENTS_API: ""
    image: tradingagents-web-frontend:local
    depends_on:
      web-api:
        condition: service_healthy
    ports:
      - "${TRADINGAGENTS_WEB_HTTP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  tradingagents_web_data:
